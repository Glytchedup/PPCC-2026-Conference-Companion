name = "ppcc-2026-companion"
main = "worker.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./public"
binding = "ASSETS"

# Wrangler 4.45+ automatically provisions the KV namespace on deployment.
# Do not commit account-specific namespace IDs or secrets.
[[kv_namespaces]]
binding = "EVENTS"